# ============================================================
# BEGINNER-FRIENDLY CONFIGURATION GUIDE
# File: application.properties
# Each property below changes one part of Spring Boot/Cloud behavior.
# Comments explain the intent without changing the configured value.
# ============================================================

# Logical service name used by Spring Cloud/Eureka/Config.
spring.application.name=project-service

# TCP port on which this service listens for HTTP requests.
server.port=8083


# ===============================
# MYSQL DATABASE
# ===============================

# JDBC address of the database used by this service.
spring.datasource.url=jdbc:mysql://localhost:3306/project_db

# Database username used when opening a JDBC connection.
spring.datasource.username=root
# Database password. Prefer an environment variable/secret outside local development.
spring.datasource.password=12345678

# Application/framework configuration used by this service.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================

# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.hibernate.ddl-auto=update

# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.show-sql=true

# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# ACTUATOR
# ===============================

# Application/framework configuration used by this service.
management.endpoints.web.exposure.include=health,info

# ===============================
# DEPARTMENT SERVICEurl
# ===============================

# ==================================
# DEPARTMENT SERVICE URL
# ==================================

# Application/framework configuration used by this service.
department.service.url=http://localhost:8082


# ==================================
# OPENFEIGN TIMEOUT
# ==================================

# Spring Cloud Config setting used to load centralized configuration.
spring.cloud.openfeign.client.config.department-service.connectTimeout=2000

# Spring Cloud Config setting used to load centralized configuration.
spring.cloud.openfeign.client.config.department-service.readTimeout=3000

# ==================================
# CIRCUIT BREAKER
# ==================================

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.register-health-indicator=true

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.sliding-window-type=COUNT_BASED

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=5

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.minimum-number-of-calls=5

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.automatic-transition-from-open-to-half-open-enabled=true


# ==================================
# RETRY
# ==================================

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentRetry.max-attempts=3

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentRetry.wait-duration=500ms

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentRetry.retry-exceptions[0]=feign.RetryableException
# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentRetry.retry-exceptions[1]=feign.FeignException$ServiceUnavailable
# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentRetry.retry-exceptions[2]=feign.FeignException$GatewayTimeout

# Ignore genuine department-not-found errors
# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.ignore-exceptions[0]=com.company.project_service.exception.DepartmentNotFoundException

# Record downstream availability failures
# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.record-exceptions[0]=feign.RetryableException
# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.record-exceptions[1]=feign.FeignException$ServiceUnavailable
# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.record-exceptions[2]=feign.FeignException$GatewayTimeout


