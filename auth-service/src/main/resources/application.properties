# ============================================================
# BEGINNER-FRIENDLY CONFIGURATION GUIDE
# File: application.properties
# Each property below changes one part of Spring Boot/Cloud behavior.
# Comments explain the intent without changing the configured value.
# ============================================================

# Logical service name used by Spring Cloud/Eureka/Config.
spring.application.name=auth-service
# TCP port on which this service listens for HTTP requests.
server.port=8084

# Config Server (optional for local startup; change to non-optional when your config server is mandatory)
# Spring Cloud Config setting used to load centralized configuration.
spring.config.import=optional:configserver:http://localhost:8888

# Eureka
# Service-discovery setting used to register with or locate services through Eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Service-discovery setting used to register with or locate services through Eureka.
eureka.instance.prefer-ip-address=true

# MySQL
# JDBC address of the database used by this service.
spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&serverTimezone=UTC
# Database username used when opening a JDBC connection.
spring.datasource.username=root
# Database password. Prefer an environment variable/secret outside local development.
spring.datasource.password=12345678

# JPA
# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.hibernate.ddl-auto=update
# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.show-sql=true
# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.open-in-view=false

# JWT - RSA/RS256
# Authentication/security setting used by the JWT or Spring Security configuration.
jwt.private-key=classpath:keys/private.pem
# Authentication/security setting used by the JWT or Spring Security configuration.
jwt.public-key=classpath:keys/public.pem
# Authentication/security setting used by the JWT or Spring Security configuration.
jwt.issuer=company-management-auth
# Authentication/security setting used by the JWT or Spring Security configuration.
jwt.access-token-expiration=900

# Actuator
# Application/framework configuration used by this service.
management.endpoints.web.exposure.include=health,info
# Application/framework configuration used by this service.
management.endpoint.health.show-details=when-authorized

# Authentication/security setting used by the JWT or Spring Security configuration.
logging.level.org.springframework.security=INFO


