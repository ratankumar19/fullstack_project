# ============================================================
# BEGINNER-FRIENDLY CONFIGURATION GUIDE
# File: application.properties
# Each property below changes one part of Spring Boot/Cloud behavior.
# Comments explain the intent without changing the configured value.
# ============================================================

# ==================================
# APPLICATION
# ==================================

# Logical service name used by Spring Cloud/Eureka/Config.
spring.application.name=api-gateway

# TCP port on which this service listens for HTTP requests.
server.port=8080


# ==================================
# EUREKA CLIENT
# ==================================

# Service-discovery setting used to register with or locate services through Eureka.
eureka.client.register-with-eureka=true

# Service-discovery setting used to register with or locate services through Eureka.
eureka.client.fetch-registry=true

# Service-discovery setting used to register with or locate services through Eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Service-discovery setting used to register with or locate services through Eureka.
eureka.instance.prefer-ip-address=true


# ==================================
# EMPLOYEE SERVICE
# ==================================

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[0].id=employee-service

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[0].uri=lb://employee-service

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/employees/**


# ==================================
# DEPARTMENT SERVICE
# ==================================

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[1].id=department-service

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[1].uri=lb://department-service

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/departments/**


# ==================================
# PROJECT SERVICE
# ==================================

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[2].id=project-service

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[2].uri=lb://project-service

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/projects/**


# ==================================
# PROJECT ASSIGNMENT SERVICE
# ==================================

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[3].id=project-assignments

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[3].uri=lb://project-service

# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/project-assignments/**


# ==================================
# ACTUATOR
# ==================================

# Application/framework configuration used by this service.
management.endpoints.web.exposure.include=health,info,gateway

# Application/framework configuration used by this service.
management.endpoint.gateway.access=read-only

##eureka client configuration
# Service-discovery setting used to register with or locate services through Eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Service-discovery setting used to register with or locate services through Eureka.
eureka.instance.prefer-ip-address=true

# Spring Cloud Config setting used to load centralized configuration.
spring.config.import=configserver:http://localhost:8888

# ==================================
# AUTH SERVICE
# ==================================
# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[4].id=auth-service
# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[4].uri=lb://auth-service
# API Gateway routing/filter setting that controls how incoming requests reach a microservice.
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/auth/**,/.well-known/jwks.json
