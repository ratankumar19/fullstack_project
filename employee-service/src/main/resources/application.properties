# ============================================================
# BEGINNER-FRIENDLY CONFIGURATION GUIDE
# File: application.properties
# Each property below changes one part of Spring Boot/Cloud behavior.
# Comments explain the intent without changing the configured value.
# ============================================================

# Logical service name used by Spring Cloud/Eureka/Config.
spring.application.name=employee-service

# Server port configuration
# TCP port on which this service listens for HTTP requests.
server.port=8081

# MySQL Database
# JDBC address of the database used by this service.
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db
# Database username used when opening a JDBC connection.
spring.datasource.username=root
# Database password. Prefer an environment variable/secret outside local development.
spring.datasource.password=12345678

# JPA / Hibernate
# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.hibernate.ddl-auto=update
# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.show-sql=true
# JPA/Hibernate setting controlling ORM/database behavior.
spring.jpa.properties.hibernate.format_sql=true

#noinspection SpringBootApplicationProperties
# Application/framework configuration used by this service.
department.service.url=http://localhost:8082


# Spring Cloud Config setting used to load centralized configuration.
spring.cloud.openfeign.client.config.department-service.connect-timeout=2000
# Spring Cloud Config setting used to load centralized configuration.
spring.cloud.openfeign.client.config.department-service.read-timeout=3000

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.register-health-indicator=true

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.sliding-window-type=COUNT_BASED

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.sliding-window-size=5

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.minimum-number-of-calls=5

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.failure-rate-threshold=50

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.wait-duration-in-open-state=10s

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.permitted-number-of-calls-in-half-open-state=2

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.circuitbreaker.instances.departmentService.ignore-exceptions=com.company.employee.exception.DepartmentNotFoundException

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentServiceRetry.max-attempts=3

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentServiceRetry.wait-duration=500ms

# Resilience4j setting controlling retry/circuit-breaker behavior for remote calls.
resilience4j.retry.instances.departmentServiceRetry.ignore-exceptions=com.company.employee.exception.DepartmentNotFoundException

# // Eureka Client Configuration
#spring.application.name=employee-service

# Service-discovery setting used to register with or locate services through Eureka.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Service-discovery setting used to register with or locate services through Eureka.
eureka.instance.prefer-ip-address=true

# CENTRALIZED CONFIGURATION
# Spring Cloud Config setting used to load centralized configuration.
spring.config.import=configserver:http://localhost:8888
